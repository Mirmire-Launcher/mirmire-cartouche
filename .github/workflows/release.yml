# SPDX-License-Identifier: GPL-3.0-or-later
# Mirmire Cartouche's releases: push a tag `v<major>.<minor>.<patch>` (or run this workflow by hand with one) and it
# builds the Android plugin, exports the release APK with Godot, signs it with the release key held in this repository's
# secrets, and publishes a GitHub release with it as `mirmire-cartouche.apk`, the name Mirmire downloads from
# `releases/latest/download/` when it installs or updates Mirmire Cartouche.
#
# Secrets (Settings › Secrets and variables › Actions), made once with keytool (see docs/mirmire-releasing.md):
#   RELEASE_KEYSTORE_BASE64  the release keystore, base64
#   RELEASE_KEYSTORE_USER    its key alias
#   RELEASE_KEYSTORE_PASSWORD  its password
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version to release, as a tag: v0.6.0"
        required: true

permissions:
  contents: write

env:
  GODOT_VERSION: "4.7.2"

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Version from the tag
        id: version
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          [[ "$tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]] || { echo "::error::A tag looks like v0.6.0, not $tag"; exit 1; }
          name="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
          # Android's version code from the version: 0.6.0 is 600, 1.2.3 is 10203. Always above Cartouche's own.
          code=$(( BASH_REMATCH[1] * 10000 + BASH_REMATCH[2] * 100 + BASH_REMATCH[3] ))
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3
        with:
          # Its default list asks for the old `tools` package, which no longer exists.
          packages: "platform-tools platforms;android-36 build-tools;36.1.0"

      - name: Godot and its export templates
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -sSfL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -sSfL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q godot.zip -d "$RUNNER_TEMP/godot"
          echo "GODOT=$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"
          templates="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$templates"
          unzip -q templates.tpz -d "$RUNNER_TEMP/templates"
          mv "$RUNNER_TEMP"/templates/templates/* "$templates/"
          # The editor's Android settings: the SDK and the JDK the export uses.
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-${GODOT_VERSION%.*}.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

      - name: The release key
        env:
          KEYSTORE: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          [ -n "$KEYSTORE" ] || { echo "::error::The RELEASE_KEYSTORE_BASE64 secret is not set (docs/mirmire-releasing.md)"; exit 1; }
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: The Android plugin
        working-directory: kotlin
        run: ./gradlew --no-daemon :android:syncToGodot

      - name: The version in the export preset
        run: |
          sed -i "s/^version\/code=.*/version\/code=${{ steps.version.outputs.code }}/; s/^version\/name=.*/version\/name=\"${{ steps.version.outputs.name }}\"/" app/export_presets.cfg
          grep -E "^version/(code|name)=" app/export_presets.cfg

      - name: Import the project
        run: timeout 900 "$GODOT" --headless --path app --import || true

      - name: Export the release APK
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.RELEASE_KEYSTORE_USER }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: scripts/export_apk.sh release build/mirmire-cartouche.apk

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.version.outputs.tag }}"
          notes="Mirmire Cartouche ${{ steps.version.outputs.name }}. Install it from Mirmire: Settings › Plugins, or download mirmire-cartouche.apk below."
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" build/mirmire-cartouche.apk --clobber
          else
            gh release create "$tag" build/mirmire-cartouche.apk --title "Mirmire Cartouche ${{ steps.version.outputs.name }}" \
              --notes "$notes" --target "$GITHUB_SHA"
          fi
