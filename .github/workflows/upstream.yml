# SPDX-License-Identifier: GPL-3.0-or-later
# Keeps Mirmire Cartouche up with Cartouche: once a day (or run by hand) it looks for a Cartouche release not merged yet,
# merges it on a branch of its own, `upstream/<tag>`, runs the tests and builds a signed release APK. Then it opens a
# pull request with that APK attached to the run, to try on a device. Merging the pull request publishes the next
# Mirmire Cartouche release (publish-upstream.yml). A merge that conflicts, or a failing test or build, opens an issue
# instead, and nothing is published.
#
# The repository must let workflows open pull requests: Settings › Actions › General › Workflow permissions, "Allow
# GitHub Actions to create and approve pull requests". The release key comes from the same secrets as release.yml.
name: Cartouche updates

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

env:
  GODOT_VERSION: "4.7.2"
  UPSTREAM: Hakimba/cartouche

concurrency:
  group: upstream
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cartouche's latest release
        id: release
        run: |
          tag=$(gh api "repos/$UPSTREAM/releases/latest" -q .tag_name)
          echo "Cartouche's latest release: $tag"
          # Its commit, fetched without Cartouche's tags (their versions are not ours).
          git fetch --no-tags "https://github.com/$UPSTREAM.git" "refs/tags/$tag:refs/upstream/$tag"
          sha=$(git rev-parse "refs/upstream/$tag^{commit}")
          branch="upstream/$tag"
          new=true
          if git merge-base --is-ancestor "$sha" HEAD; then
            echo "$tag is merged already."; new=false
          elif git ls-remote --exit-code --heads origin "$branch" > /dev/null; then
            echo "$branch exists already: its pull request is waiting."; new=false
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "new=$new" >> "$GITHUB_OUTPUT"

      - name: Merge it
        id: merge
        if: steps.release.outputs.new == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "${{ steps.release.outputs.branch }}"
          if git merge --no-edit -m "Merge Cartouche ${{ steps.release.outputs.tag }}" "${{ steps.release.outputs.sha }}"; then
            echo "conflicts=" >> "$GITHUB_OUTPUT"
          else
            files=$(git diff --name-only --diff-filter=U | sed 's/^/- `/; s/$/`/')
            git merge --abort
            { echo "conflicts<<EOF"; echo "$files"; echo "EOF"; } >> "$GITHUB_OUTPUT"
          fi

      - name: Report the conflicts
        if: steps.merge.outputs.conflicts != ''
        run: |
          title="Cartouche ${{ steps.release.outputs.tag }} does not merge on its own"
          if [ -z "$(gh issue list --state open --search "in:title \"$title\"" -q '.[].number' --json number)" ]; then
            gh issue create --title "$title" --body "$(printf '%s\n\n%s\n\n%s\n' \
              "Merging [Cartouche ${{ steps.release.outputs.tag }}](https://github.com/$UPSTREAM/releases/tag/${{ steps.release.outputs.tag }}) into \`main\` conflicts in:" \
              "${{ steps.merge.outputs.conflicts }}" \
              "Merge it by hand (\`git fetch --no-tags https://github.com/$UPSTREAM.git refs/tags/${{ steps.release.outputs.tag }}\`), then release as usual.")"
          fi
          echo "::warning::Cartouche ${{ steps.release.outputs.tag }} conflicts; an issue says where."

      - name: Go on
        id: go
        run: echo "on=${{ steps.release.outputs.new == 'true' && steps.merge.outputs.conflicts == '' }}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        if: steps.go.outputs.on == 'true'
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3
        if: steps.go.outputs.on == 'true'
        with:
          # Its default list asks for the old `tools` package, which no longer exists.
          packages: "platform-tools platforms;android-36 build-tools;36.1.0"

      - name: Godot and its export templates
        if: steps.go.outputs.on == 'true'
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -sSfL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -sSfL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q godot.zip -d "$RUNNER_TEMP/godot"
          echo "GODOT=$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"
          templates="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$templates"
          unzip -q templates.tpz -d "$RUNNER_TEMP/templates"
          mv "$RUNNER_TEMP"/templates/templates/* "$templates/"
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-${GODOT_VERSION%.*}.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

      - name: The Android plugin and its tests
        if: steps.go.outputs.on == 'true'
        working-directory: kotlin
        run: ./gradlew --no-daemon :android:testDebugUnitTest :android:syncToGodot

      - name: The GDScript tests
        if: steps.go.outputs.on == 'true'
        run: scripts/test_godot.sh

      - name: The release key
        if: steps.go.outputs.on == 'true'
        env:
          KEYSTORE: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          [ -n "$KEYSTORE" ] || { echo "::error::The RELEASE_KEYSTORE_BASE64 secret is not set (docs/mirmire-releasing.md)"; exit 1; }
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: A release APK to try
        if: steps.go.outputs.on == 'true'
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.RELEASE_KEYSTORE_USER }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: |
          timeout 900 "$GODOT" --headless --path app --import || true
          scripts/export_apk.sh release build/mirmire-cartouche.apk

      - uses: actions/upload-artifact@v4
        if: steps.go.outputs.on == 'true'
        id: apk
        with:
          name: mirmire-cartouche-${{ steps.release.outputs.tag }}
          path: build/mirmire-cartouche.apk
          retention-days: 30

      - name: The pull request
        if: steps.go.outputs.on == 'true'
        run: |
          tag="${{ steps.release.outputs.tag }}"
          git push origin "${{ steps.release.outputs.branch }}"
          run="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          gh pr create --base main --head "${{ steps.release.outputs.branch }}" --title "Cartouche $tag" --body "$(cat <<EOF
          [Cartouche $tag](https://github.com/$UPSTREAM/releases/tag/$tag) merged into Mirmire Cartouche, without conflicts. The Kotlin and GDScript tests pass and the release APK builds.

          **Try it:** the APK is on [this run]($run) (\`mirmire-cartouche-$tag\`, signed with the release key, so it installs over the published app). Check the 3D home, the consoles and games, a game played through Mirmire, and Exit Big Picture.

          **Merging this publishes** the next Mirmire Cartouche release, and Mirmire offers it in Settings › Plugins.
          EOF
          )"

      - name: Report a failure
        if: failure() && steps.release.outputs.new == 'true'
        run: |
          title="Cartouche ${{ steps.release.outputs.tag }}: the tests or the build fail"
          run="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ -z "$(gh issue list --state open --search "in:title \"$title\"" -q '.[].number' --json number)" ]; then
            gh issue create --title "$title" --body "Merged with Cartouche ${{ steps.release.outputs.tag }}, Mirmire Cartouche does not pass: see [the run]($run). Nothing was published."
          fi
